[pytest]
# PARALLEL BY DEFAULT. The suite is 875 tests and took 6m29s serially, almost
# all of it per-test setup rather than any one slow test -- the top 25 slowest
# accounted for 40s of 389s. Across 12 workers it is under a minute.
#
# This is safe here for a reason that already existed: conftest names the temp
# database and the log directory after `os.getpid()`, so every xdist worker --
# a separate process -- gets its own. The process-wide singletons (the strategy
# registry, the feed manager, the log buffer) are per process too, so a worker
# cannot see another worker's state.
#
# `loadfile`, NOT `load`: loadfile sends a whole FILE to one worker and so
# preserves the order tests run in within it, while `load` scatters individual
# tests across workers. This suite has at least one test that depends on
# process state a previous test in the same file left behind, and `load` was
# measured at 53.8s against loadfile's 56.9s -- 5% is not worth reintroducing
# that class of failure, which is intermittent and reads like a real bug.
#
# To disable it for one run -- debugging, a breakpoint, readable -x output --
# pass `-n0`.
addopts = -n auto --dist loadfile
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
