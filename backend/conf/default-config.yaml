# ---------------------------------------------------------------------------
# Default application configuration.
#
# Loaded from the path in the CONFIG_PATH env var (defaults to ./conf).
# `default-config.yaml` is always read first; if a `local-config.yaml` sits
# beside it, it is deep-merged on top so local overrides never touch this file.
#
# Secrets do NOT live here. They come from the environment (.env) and are
# referenced below as ${VAR_NAME} or ${VAR_NAME:default}.
# ---------------------------------------------------------------------------

server:
  host: "0.0.0.0"
  port: 8000
  uvicorn_workers: 1          # MUST stay 1: the upstream feed is a single
                              # process-wide connection (see market_feed below).
  cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

  # ---------------------------------------------------------------------
  # SINGLE-PORT MODE. When this directory holds a built frontend
  # (frontend/npm run build), the backend serves the UI as well as the API,
  # so http://localhost:8000 is the whole application and no Node process is
  # needed. Relative paths resolve against the backend directory.
  #
  # This is additive: the two-port dev setup (Vite on :5173 proxying /api and
  # /ws to :8000) keeps working exactly as before and is still the
  # development default. If the directory has no index.html, the app logs how
  # to build it and serves the API only -- it does not fail.
  #
  # Set this to "" to turn single-port serving off entirely.
  # ---------------------------------------------------------------------
  static_dir: "${STATIC_DIR:../frontend/dist}"

logging:
  # Levels here (and LOG_LEVEL in the environment) override whatever
  # conf/logging-config.ini sets. LOG_LEVEL wins only when these are blank.
  level: "${LOG_LEVEL:INFO}"
  access_log_level: "${LOG_LEVEL:INFO}"
  # Where app.log and access.log are written. Handler class, rotation size and
  # backup count live in conf/logging-config.ini; drop a
  # local-logging-config.ini beside it to replace that wholesale.
  log_dir: "${LOG_DIR:./logs}"

database:
  # SQLite by default. To use MySQL, replace this one line, e.g.
  #   url: "mysql+aiomysql://user:pass@127.0.0.1:3306/crude_paper?charset=utf8mb4"
  # Every query goes through SQLAlchemy, and the Alembic migrations are written
  # to run clean on both backends.
  url: "${DATABASE_URL:sqlite+aiosqlite:///./data/paper_trading.db}"
  echo: false

auth:
  # Authentication is against the `users` table -- see src/users/. There is no
  # env-var credential pair any more: APP_USERNAME and APP_PASSWORD were
  # removed rather than left as a fallback, because two authentication paths is
  # exactly the kind of thing that rots, and an env-var backdoor outliving the
  # table it was meant to replace is worse than no backdoor at all.
  #
  # Password for the seeded default administrator (trader@abc.com), used ONLY
  # when that row does not yet exist. Changing it later has no effect -- change
  # the password in the UI instead. If this is blank the administrator is not
  # created and nobody can log in.
  admin_password: "${APP_ADMIN_PASSWORD:}"
  jwt_secret: "${APP_JWT_SECRET:}"
  jwt_algorithm: "HS256"
  session_hours: 12
  cookie_name: "dcpt_session"
  cookie_secure: false        # true only when served over HTTPS
  cookie_samesite: "lax"

security:
  # Key used to encrypt secret settings at rest (currently the Dhan access
  # token, stored in the app_settings table). Derived via HKDF-SHA256.
  #
  # Prefer a dedicated key: rotating APP_JWT_SECRET then does not destroy the
  # stored token. If this is blank, APP_JWT_SECRET is used instead. If BOTH are
  # blank, the application refuses to store a token rather than encrypt it
  # under a per-process random key it could never read back.
  #   python3 -c "import secrets; print(secrets.token_urlsafe(48))"
  encryption_key: "${APP_ENCRYPTION_KEY:}"

dhan:
  # NOTE: these are the .env FALLBACK values. Anything saved on the Settings
  # page is stored in the database and overlaid on top of these at startup and
  # on save -- the UI wins. See src/settings/services/settings_service.py.
  client_id: "${DHAN_CLIENT_ID:}"
  access_token: "${DHAN_ACCESS_TOKEN:}"
  api_base_url: "https://api.dhan.co/v2"
  feed_ws_url: "wss://api-feed.dhan.co"
  # 35 MB CSV, refreshed daily by Dhan. Re-fetched at runtime because security
  # IDs change every expiry.
  instrument_master_url: "https://images.dhan.co/api-data/api-scrip-master-detailed.csv"
  instrument_master_cache_dir: "./data/instrument_master"
  instrument_master_max_age_hours: 12
  http_timeout_seconds: 30

# ---------------------------------------------------------------------------
# STRATEGY MODULES live in conf/strategies/, one YAML per strategy.
#
# Everything specific to trading one thing moved there on 2026-09-18: the
# underlying and its exchange segment, the contract specification, the market
# hours, the subscription policy, the charge rate card and the margin model.
# What is left in this file is generic -- it would be identical for an NSE
# index-options strategy.
#
# Whether a strategy is RUNNING is not in YAML at all: it is a row in
# `feature_toggles`, owned by the Strategies & Features page, so switching one
# off is an operator action rather than a redeploy.
# ---------------------------------------------------------------------------

capabilities:
  # Generic features, each of which can be switched off everywhere at once.
  # A strategy additionally declares which of them it supports; the effective
  # state is the intersection, so a capability cannot be switched on for a
  # strategy that cannot support it.
  #
  # These are the DEFAULTS for a fresh installation. After that the live state
  # is a `feature_toggles` row.
  option-chain:
    enabled: true
  price-chart:
    enabled: true
  trade-notes:
    enabled: true
  pnl-reports:
    enabled: true
  # chart-trading and greeks take their defaults from the older
  # `chart_trading.enabled` / `greeks_poller.enabled` flags below, so an
  # operator who had set either keeps what they configured.

market_feed:
  enabled: true

  # ---------------------------------------------------------------------
  # SYNTHETIC FEED — THIS IS FAKE DATA. It exists so the whole stack can be
  # exercised without Dhan credentials or outside market hours. When true, no
  # upstream connection is opened and prices are generated locally. The UI
  # shows a loud "SYNTHETIC" banner whenever this is on.
  # Set to false (and supply DHAN_* credentials) for real market data.
  # ---------------------------------------------------------------------
  synthetic_feed: "${DHAN_SYNTHETIC_FEED:true}"
  synthetic_base_price: 6800.0       # starting CRUDEOIL future price (Rs/barrel)
  synthetic_volatility: 0.35         # annualised, drives both the walk and the smile
  synthetic_tick_interval_ms: 250

  mode: "FULL"                      # TICKER | QUOTE | FULL. Options need FULL
                                    # (5-level depth + OI).
  # strike_window, expiries_to_subscribe and resubscribe_move_strikes are per
  # strategy: see the `subscription:` block in conf/strategies/*.yaml. Each
  # enabled strategy contributes its own targets to THIS one connection.
  max_instruments_per_subscribe: 100
  max_instruments_per_connection: 5000
  # Dhan allows 5 concurrent feed connections per user. This process uses
  # exactly one and fans it out to every browser tab; the number is here so the
  # system health page can show the budget rather than hardcode it. A second
  # instance on the same credentials (a spare-port verification run, say) takes
  # a second slot, which this process cannot see.
  max_connections_per_user: 5
  reconnect_backoff_initial_seconds: 1.0
  reconnect_backoff_max_seconds: 30.0
  server_inactivity_timeout_seconds: 40   # Dhan drops us after 40s of silence
  stale_tick_warn_seconds: 10

fanout:
  # Coalescing interval for pushing to browsers. Ticks land in the in-memory
  # book immediately; only changed rows are flushed to clients on this tick.
  broadcast_interval_ms: 100
  max_client_queue: 64

greeks_poller:
  # The default for the `greeks` capability, which is what actually gates the
  # poller now. Kept under its old name so an operator who set it keeps it.
  enabled: true
  # Dhan rate limit: ONE request per 3 seconds per unique underlying+expiry.
  # Different expiries may be polled concurrently. The limit is Dhan's, so it
  # stays global; how many expiries a strategy asks for is in its own YAML.
  interval_seconds: 3.0

# market_hours moved to conf/strategies/*.yaml on 2026-09-18. MCX trades
# 09:00-23:30 IST and NSE 09:15-15:30, so the session is a property of the
# strategy, not of the application.

chart_trading:
  # `enabled` here is the default for the `chart-trading` capability, which is
  # what gates the feature now.
  # One-click trading from the futures chart. A Buy buys the nearest ATM CALL
  # and a Sell the nearest ATM PUT -- never a written option, so the worst case
  # is always the premium paid. The stop-loss and take-profit lines dragged onto
  # the chart are levels of the FUTURE; bracket_monitor watches the future and
  # closes the OPTION at market when one is crossed.
  #
  # A stop at a futures level does NOT bound the loss in rupees: what the option
  # is worth when the level is reached depends on delta, decay and IV.
  enabled: true
  default_lots: 1
  # Bracket levels are checked on this cadence, on their own task with their own
  # database session -- never on the tick path.
  bracket_interval_ms: 250

portfolios:
  # A portfolio behaves like one demat account: it holds money, it is attached
  # to strategies, and every order, position and chart trade belongs to exactly
  # one. Its balance is NEVER stored -- it is the sum of its cash ledger, the
  # same way realised P&L is replayed from fills rather than kept as a total.
  #
  # These two values are used ONCE, by the migration that introduces
  # portfolios: it creates this portfolio and assigns every pre-existing trade
  # to it. Changing them afterwards has no effect -- deposit on the Portfolios
  # page instead.
  default_name: "Main"
  # A deliberate number, not something derived from existing P&L. One CRUDEOIL
  # lot is 100 barrels, so an ATM option at a Rs 150 premium costs Rs 15,000;
  # ten lakh leaves room for several positions plus the short-margin estimate.
  default_opening_balance: 1000000

trading:
  # Fill simulation. See src/orders/services/fill_simulator.py.
  default_lots: 1
  max_lots_per_order: 100
  # Market orders cross the spread and pay the opposite side of the touch.
  # Depth beyond level 1 is consumed in order, so a large order walks the book.
  allow_partial_fills: true
  # If the resting depth cannot fill the whole order, the remainder stays open
  # (limit) or is rejected (market) depending on this flag.
  reject_market_order_on_insufficient_depth: false
  # Extra adverse slippage applied to marketable fills, in ticks. This is on
  # top of walking the book, and models queue/latency effects.
  slippage_ticks: 1
  # A limit order only fills once the opposite side of the book actually
  # crosses it, and then only for the quantity displayed at that level.
  # Setting this false makes a resting order fill when the market merely
  # TOUCHES its price, which ignores queue position and flatters every limit
  # strategy. Leave it true unless you know why you want otherwise.
  limit_fill_requires_cross: true

  # Background matcher for resting limit orders. Runs off the tick path with
  # its own database session.
  matcher_enabled: true
  matcher_interval_ms: 250
