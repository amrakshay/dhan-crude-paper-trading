# ---------------------------------------------------------------------------
# STRATEGY MODULE: NSE Swing Momentum (breadth-gated momentum rotation).
#
# A weekly/daily momentum rotation on the Nifty 500. It owns MANY underlyings
# rather than one, which is the first thing in this application to do so, and
# it is the reason a strategy can now declare a UNIVERSE.
#
# The rules, the parameters and the backtested results live in the strategy
# specification, not here:
#   ~/Workarea/local/pullback/backend/intrday_test_strategy/research2/
#     SWING_MOMENTUM_HANDOFF.md
# This file carries only what THIS application needs to know to run it.
#
# WHETHER THIS STRATEGY IS ON is NOT declared here. `enabled_by_default` only
# decides the state a brand-new installation starts in; after that the live
# state is a row in the `feature_toggles` table, owned by the Strategies &
# Features page.
#
# It ships ON as of 2026-09-18, at the owner's request -- but NOT ARMED. The two
# switches are separate precisely because this is the first strategy in the
# application that decides on a schedule with nobody watching:
#
#   enabled  -> it computes, decides and writes a decision record every session
#   armed    -> it may submit an order
#
# `automation.armed_by_default` below is false, and stays false. Enabling the
# strategy therefore starts the journal, not the trading.
# ---------------------------------------------------------------------------

key: "nse-swing-momentum"
label: "NSE Swing Momentum"
description: >-
  A breadth-gated momentum rotation on the Nifty 500. Holds up to ten of the
  strongest volatility-adjusted six-month momentum names, in proportion to
  market breadth, with a chandelier trailing stop under each, and goes fully
  to cash when the NIFTY 50 loses its 200-day SMA.
enabled_by_default: true

underlying:
  # There is no single underlying. `symbol` names the BOOK rather than a
  # contract; ownership is resolved against the universe below, not against
  # this value. It is still the label a generic surface prints when it has
  # only a strategy to go on.
  symbol: "NIFTY500"
  exchange_segment: "NSE_EQ"
  exchange_segment_code: 1          # numeric code used by the binary feed
  exchange_id: "NSE"

universe:
  # The list of symbols this strategy may trade. A FILE, deliberately, not a
  # scrape: NSE publishes the current constituents at
  #   https://nsearchives.nseindia.com/content/indices/ind_nifty500list.csv
  # and refreshing this file is a quarterly manual copy. That keeps the
  # application's outbound surface exactly as small as it was.
  #
  # Copied verbatim from the research project's universe_nifty500.csv on
  # 2026-09-18 (500 rows). Its `security_id` column is NOT authoritative --
  # see conf/universes/README.md.
  name: "nifty500"
  file: "universes/nifty500.csv"

instrument_sets:
  # Which rows of Dhan's instrument master this strategy claims.
  - instrument_type: "EQUITY"
    exchange_segment: "NSE_EQ"
    exchange_segment_code: 1
    symbols: "universe"

    # -----------------------------------------------------------------------
    # For NSE EQUITY, LOT_SIZE=1.0 in the master is CORRECT -- a delivery trade
    # is one share. That is the opposite of the MCX defect (root CLAUDE.md
    # section 5), where 1.0 means "not published" and is substituted from
    # contract_specs. Requiring a contract_specs entry here would mean 500 of
    # them, each restating a number the master already gets right.
    # Verified against the live master 2026-09-18: every one of the 499
    # universe rows present reports LOT_SIZE=1.0.
    # -----------------------------------------------------------------------
    lot_size_source: "master"

    # -----------------------------------------------------------------------
    # NSE publishes more than one EQUITY row under a single UNDERLYING_SYMBOL.
    # Verified 2026-09-18: CHOLAFIN and MOTHERSON each have their share
    # (SERIES=EQ) and a listed non-convertible debenture (SERIES=D1,
    # DISPLAY_NAME "CIFCL-7.5%-30092026-NCD" and "SMIL-6.5%-20092027-NCD").
    # Ingesting the debenture instead of the share would be a wrong price that
    # looks entirely plausible.
    #
    # EQ is the ordinary rolling segment; BE is trade-for-trade, which is a
    # settlement restriction rather than a different security -- HEG and HFCL
    # are in BE today and are genuine constituents. Both are wanted; D1 is not.
    # -----------------------------------------------------------------------
    series: ["EQ", "BE"]

    # The ticker, not the company's long name: DISPLAY_NAME for BHEL is
    # "Bharat Heavy Electricals", while UNDERLYING_SYMBOL is "BHEL", which is
    # what a ranking table and an order row want to show.
    trading_symbol_source: "underlying_symbol"

reference_instruments:
  # Instruments this strategy READS but never trades. These are deliberately
  # not ingested into the `instruments` table -- see ReferenceInstrument in
  # src/strategies/services/strategy_definition.py for why (Dhan's security
  # ids are unique per segment, not globally: id 13 is NIFTY in IDX_I and ABB
  # in NSE_EQ, and ABB is in this universe).
  regime_index:
    # The regime gate (P8/P9 in the spec) is evaluated on this index's daily
    # CLOSE. No live tick is needed and none is subscribed.
    symbol: "NIFTY"
    label: "NIFTY 50"
    security_id: "13"
    exchange_segment: "IDX_I"
    exchange_segment_code: 0
    instrument: "INDEX"

contract_specs:
  # No per-symbol contract specification: the master's lot size is trusted
  # (see instrument_sets above), so there is nothing to override.
  #
  # -------------------------------------------------------------------------
  # Dhan publishes TICK_SIZE in paise on NSE exactly as it does on MCX.
  # Verified against the live master on 2026-09-18: the distinct TICK_SIZE
  # values across the 9,884 NSE EQUITY rows are 1.0, 5.0, 10.0, 50.0, 100.0
  # and 500.0 -- i.e. Rs 0.01 to Rs 5.00. Divide by this to get rupees.
  #
  # This corrects the comment in conf/strategies/mcx-crude-options.yaml, which
  # claimed an NSE strategy "needs no tick-size divisor at all".
  # -------------------------------------------------------------------------
  tick_size_divisor: 100

market_hours:
  # NSE cash equity.
  timezone: "Asia/Kolkata"
  open: "09:15"
  close: "15:30"
  trading_days: [0, 1, 2, 3, 4]     # Mon-Fri (Python weekday numbering)

  # ---------------------------------------------------------------------------
  # The Closing Auction Session, live since 3 August 2026.
  #
  # For F&O-eligible names, continuous cash trading ends at 15:15 and a call
  # auction runs to 15:35. The rest of the market trades continuously to 15:30.
  # Two consequences this application has to model, both about the trailing
  # stop (P14/P15):
  #
  #   * an order sent for one of those names between 15:15 and the close cannot
  #     execute in continuous trading -- it lands in the auction; and
  #   * this simulator has NO model of a call auction. Filling such an order
  #     against the last continuous depth book would flatter the fill.
  #
  # So a stop that triggers in that window on an F&O name is RECORDED as
  # triggered and its exit waits for the next session's open. The backtest
  # predates the CAS entirely and assumes a continuous market to the close;
  # that divergence is in the README's known gaps.
  #
  # `applies_to: fno_eligible` reads the column of that name on `instruments`,
  # derived from the master's own FUTSTK rows on every refresh -- 228 distinct
  # NSE underlyings as of 2026-09-18. It is not a list to maintain here.
  # source: NSE circular, CAS live 3 Aug 2026
  # ---------------------------------------------------------------------------
  closing_auction:
    applies_to: "fno_eligible"
    continuous_close: "15:15"
    auction_close: "15:35"

subscription:
  # This strategy has no option chain to centre and no strikes to window. Its
  # decisions are taken from DAILY bars fetched over REST, so the live feed is
  # needed only for what it actually trades: the names currently held, plus
  # the handful a rebalance is about to touch. Subscribing all 500 would spend
  # the one process-wide connection's budget on 490 instruments nobody reads.
  kind: "positions"

charges:
  # conf/charges/nse-equity-delivery.yaml. NSE delivery pays STT on BOTH legs
  # and a flat depository charge per sell -- neither of which a commodity card
  # has. The rate card is part of the strategy; the engine that applies it is
  # not.
  rate_card: "nse-equity-delivery"

margin:
  # -------------------------------------------------------------------------
  # This strategy never sells to open. Every position is a long delivery
  # holding paid for in full, so there is no margin to block: the cash leaves
  # the ledger when the buy fills and comes back when the sell does.
  #
  # The model is still declared, and still declared as an approximation, so
  # that a short position appearing here would be blocked at 100% of notional
  # rather than at zero -- a wrong number in the safe direction.
  # as-of: 2026-09-18
  # confidence: NOT APPLICABLE (no short leg exists in this strategy)
  # -------------------------------------------------------------------------
  model: "percent_of_notional"
  short_option_percent_of_notional: 1.00

capabilities:
  # Generic features of THIS codebase that this strategy supports. It has no
  # options, so it declares neither "option-chain" nor "greeks"; and
  # "chart-trading" translates a chart click into an option, which is not what
  # this strategy does.
  - "price-chart"
  - "trade-notes"
  - "pnl-reports"

# ---------------------------------------------------------------------------
# STRATEGY PARAMETERS -- P1 to P19 of the specification.
#
# Root CLAUDE.md section 7: no number that affects a trade is hardcoded in
# Python. Every parameter the specification names is here, under the name the
# specification gives it, so the two can be grepped against each other.
#
# These blocks mean nothing to the framework. They travel to the strategy's own
# module through `StrategyDefinition.module_config` and are validated there.
#
# WARNING. These were all chosen IN-SAMPLE, on the full backtest period, with
# no walk-forward and no holdout (specification section 15.3). They are not
# knobs to turn until the numbers improve; turning them is choosing a different
# strategy from the one that was measured.
# ---------------------------------------------------------------------------
parameters:
  # P2 -- liquidity floor. ADV20 measured as RUPEE TURNOVER, not share volume:
  # mean(close x volume, 20 sessions) >= Rs 10 crore.
  liquidity_floor_rupees: 100000000
  liquidity_window_sessions: 20

  # P3 -- price floor, rupees.
  price_floor: 50.0

  # P4 / P10 -- the trend qualifier, and the same line breadth is measured
  # against: the stock's own 200-session SMA of closes.
  trend_sma_sessions: 200

  # P5 -- momentum: close[t-skip] / close[t-lookback] - 1. Six months, with the
  # most recent week skipped so a one-week spike cannot buy its way in.
  momentum_lookback_sessions: 126
  momentum_skip_sessions: 5

  # P6 -- absolute momentum floor.
  momentum_floor: 0.10

  # P7 -- the rank score is momentum divided by ATR%. This divisor is the
  # differentiating idea: it penalises momentum bought with volatility.
  # Removing it measured 29% CAGR at an unacceptable -31% drawdown.
  volatility_adjusted_score: true
  atr_sessions: 14

  # P11 -- breadth to slots:
  #   round(max_positions x clamp((breadth - breadth_lower) / breadth_span, 0, 1))
  # 35% of the liquid universe above its own SMA200 buys nothing; 65% (i.e.
  # breadth_lower + breadth_span) buys the full book.
  #
  # The SPAN is configured rather than derived from an upper bound, and that is
  # not pedantry: 0.65 - 0.35 is 0.30000000000000004 in IEEE-754, not 0.30, and
  # the backtest divides by the literal 0.30. The difference is one slot at
  # several reachable breadth values -- 0.425 resolves to 3 slots against the
  # engine and 2 against a derived span. Configuring the span is what makes the
  # two the same arithmetic.
  breadth_lower: 0.35
  breadth_span: 0.30

  # P12 -- the most positions that may be open at once.
  max_positions: 10

  # P13 -- position size is total equity divided by this, whole shares, floored.
  # Kept separate from max_positions: sizing stays at a tenth of equity even
  # when breadth allows only four slots, so a narrow market holds cash rather
  # than concentrating.
  position_size_divisor: 10

  # P14 / P15 -- the chandelier stop, set at entry and ratcheted up on each
  # daily close, never down. Specification section 10 measures every tighter
  # variant as worse: it converts shakeouts into realised losses and ejects the
  # positions that produce the fat right tail. Do not tighten it.
  trail_atr_multiple: 3.5

  # P16 -- a holding whose rank falls below this is sold at the next open.
  rotation_exit_rank: 15

  # Warm-up. A symbol with fewer sessions than this is excluded from the
  # universe entirely, exactly as the backtest's loader excludes it -- which is
  # the whole difference between its 480-symbol and 485-symbol reproductions.
  minimum_sessions: 260

regime:
  # P8 -- the hard gate: the index's close above its own 200-session SMA.
  # P9 -- the entry filter: the index's 63-session return above zero. This
  # blocks NEW ENTRIES only; it never forces an exit.
  index_role: "regime_index"
  sma_sessions: 200
  entry_return_sessions: 63
  entry_return_minimum: 0.0

schedule:
  # P18 -- the specification's backtest rebalances on the first session of each
  # week; `swing_live.py` rebalances daily, and the owner chose daily
  # deliberately: 23.4% CAGR at -22.2% drawdown against weekly's 19.9% and
  # -18.3% (specification section 9.2). Weekly has the better MAR.
  #
  # Changing this value is the only change needed to switch.
  rebalance_cadence: "daily"        # daily | weekly

  # IST. The nightly job runs after Dhan's end-of-day data settles; the
  # rebalance runs just after the open, because P19 is a market order at the
  # next session's open.
  nightly_at: "18:15"
  rebalance_at: "09:16"

off_gate:
  # ---------------------------------------------------------------------------
  # V3b -- what to do while the index is BELOW its 200-day SMA.
  #
  # DISABLED, and it should stay that way. The owner's own research tested 13
  # variants on the extended panel and NOT ONE beat holding cash on return.
  # V3b's individual trades are genuinely good -- 38 trades over 11 years, 61%
  # win rate, mean +7.81% -- and it still ends LOWER than the baseline, because
  # capital committed to a bear rally is not available at the regime flip,
  # which is exactly when the best trades fire. Per-trade edge is not portfolio
  # edge.
  #
  # Enabling this is an informed choice against that finding.
  # ---------------------------------------------------------------------------
  enabled: false
  slots: 3
  momentum_floor: 0.10
  # V3b drops the 63-day entry filter while the gate is off.
  require_entry_return: false

automation:
  # DECLARING THIS BLOCK IS WHAT MAKES A STRATEGY AUTOMATED. A module without
  # it -- mcx-crude-options -- is discretionary: nothing schedules it, no
  # arming control is offered for it, and a stored arming row for it is
  # ignored. Every order in it comes from a person.
  #
  # The separate arming switch. Enabling the strategy makes it compute, decide
  # and record; ARMING is what lets it submit an order. Two switches, because
  # this is the first thing in the application that trades with nobody
  # watching, and watching it decide for a while before it can spend anything
  # is the cheapest possible safeguard.
  armed_by_default: false

  # ---------------------------------------------------------------------------
  # Overrides the global `trading.max_lots_per_order` (100) for this strategy.
  #
  # "Lots" means two different things. One MCX CRUDEOIL lot is 100 barrels, so
  # 100 lots is 10,000 barrels and a plausible fat finger. An NSE delivery
  # "lot" is ONE SHARE (the master's LOT_SIZE=1.0 is correct here -- see
  # instrument_sets above), so 100 of them is a Rs 5,000 position at the Rs 50
  # price floor. One cap cannot be right for both, and routing the share count
  # through `quantity_override` to dodge the check would leave `order.lots`
  # disagreeing with `order.quantity / order.lot_size` on every equity order.
  #
  # The value: a position is equity / 10 (P13), so the share count is bounded
  # by equity / 10 / price_floor -- 2,000 shares on a Rs 10,00,000 book. 50,000
  # leaves room for the book to grow 25x and is still a rail rather than a
  # ceiling anyone reaches.
  # ---------------------------------------------------------------------------
  max_lots_per_order: 50000
