; ---------------------------------------------------------------------------
; Default logging configuration, loaded with logging.config.fileConfig.
;
; Read from the directory in the CONFIG_PATH env var (defaults to ./conf),
; mirroring default-config.yaml. If `local-logging-config.ini` sits beside
; this file it is used INSTEAD of it -- ini files are not deep-mergeable the
; way the YAML is, so a local file is a full replacement. Copy this one and
; edit it.
;
; The log directory comes from the DCPT_LOG_DIR environment variable, which
; src/logging_config.py sets from the `logging.log_dir` YAML property before
; calling fileConfig. Levels set here are overridden afterwards by
; `logging.level` / `logging.access_log_level` / LOG_LEVEL -- see
; configure_logging().
; ---------------------------------------------------------------------------

[loggers]
keys=root,dcpt,dcpt_access

[handlers]
keys=app_file,access_file,console

[formatters]
keys=app_formatter,access_formatter

; Third-party loggers (uvicorn, httpx, sqlalchemy, websockets) land here, so
; their warnings and errors end up in app.log alongside ours.
[logger_root]
level=INFO
handlers=app_file,console

[logger_dcpt]
level=INFO
handlers=app_file,console
qualname=dcpt
propagate=0

; Child of `dcpt` but propagate=0, so access lines go to access.log only and
; are not duplicated into app.log.
[logger_dcpt_access]
level=INFO
handlers=access_file
qualname=dcpt.access
propagate=0

; filename:funcName:lineno is the point of this format -- it turns a log line
; into a jump target.
[formatter_app_formatter]
class=src.log_redaction.RedactingFormatter
format=%(asctime)s [%(levelname)s] %(filename)s:%(funcName)s:%(lineno)d [%(name)s] : %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_access_formatter]
class=src.log_redaction.RedactingFormatter
format=%(asctime)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

; 10 MB x 3 backups per file. `os` is in fileConfig's eval namespace because
; the logging module imports it.
[handler_app_file]
class=handlers.RotatingFileHandler
args=(os.path.join(os.environ.get('DCPT_LOG_DIR', 'logs'), 'app.log'), 'a', 10 * 1024 * 1024, 3)
formatter=app_formatter

[handler_access_file]
class=handlers.RotatingFileHandler
args=(os.path.join(os.environ.get('DCPT_LOG_DIR', 'logs'), 'access.log'), 'a', 10 * 1024 * 1024, 3)
formatter=access_formatter

[handler_console]
class=StreamHandler
formatter=app_formatter
args=(sys.stdout,)
